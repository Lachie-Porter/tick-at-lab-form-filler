<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Form</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 480px;
        margin: 60px auto;
        padding: 0 16px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
        font-weight: 600;
      }

      input,
      textarea,
      select {
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
      }

      button,
      a.btn {
        padding: 10px 16px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }

      button:hover,
      a.btn:hover {
        background: #1d4ed8;
      }

      #output {
        margin-top: 24px;
        padding: 12px;
        background: #f1f5f9;
        border-radius: 4px;
        font-size: 13px;
        white-space: pre;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>New</h1>

    <div
      id="AUss.FDT.AdditionalProcedureTrainingDetailsTable_192324_DXPEForm_PW-1"
    >
      <label>
        Investigator Name
        <input type="text" name="name" placeholder="Jane Smith" required />
      </label>

      <label>
        Procedure Name/Summary
        <input type="text" name="procedure" required />
      </label>

      <label>
        Species
        <input type="text" name="species" />
      </label>

      <label>
        Competency (Novice, Competent or Expert)
        <input type="text" name="competency" />
      </label>

      <a href="#" class="btn" id="apply-and-new">Apply &amp; New</a>
    </div>

    <div id="output"></div>

    <script>
      document
        .getElementById("apply-and-new")
        .addEventListener("click", function (e) {
          e.preventDefault();
          const form = this.closest("form");
          const data = Object.fromEntries(new FormData(form));
          const output = document.getElementById("output");
          output.style.display = "block";
          output.textContent = JSON.stringify(data, null, 2);
          form.reset();
        });
    </script>
  </body>
</html>
